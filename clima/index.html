<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consulta de Clima</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Consulta de Clima</h1>
    <p class="subtitulo">Digite o nome de uma cidade para ver o clima atual.</p>

    <form id="form-clima">
      <input type="text" id="cidade" name="cidade" placeholder="Ex.: São Paulo" required>
      <button type="submit">Consultar</button>
    </form>

    <section id="resultado" aria-live="polite"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
